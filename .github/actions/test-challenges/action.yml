name: Test challenges
description: Test challenges.
inputs:
  challenges:
    description: Top-level challenge group.
    required: true
  modified_since_ref:
    description: Base ref challenges have been modified since.
    required: false
    default: ""
  gpg_private_key:
    description: GPG private key used to unlock git-crypt.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      if: ${{ inputs.modified_since_ref != '' }}
      with:
        fetch-depth: 0

    - name: Unlock encrypted files
      if: ${{ inputs.gpg_private_key != '' }}
      uses: ./.github/actions/unlock-git-crypt
      with:
        gpg_private_key: ${{ inputs.gpg_private_key }}

    - name: Remove encrypted files
      if: ${{ inputs.gpg_private_key == '' }}
      shell: 'nix develop -c bash -euo pipefail {0}'
      run: |
        git crypt status -e \
          | sed -n 's/^[[:space:]]*encrypted:[[:space:]]*//p' \
          | sort -u \
          | xargs -r rm -f

    - name: Validate dojo.yml
      shell: 'nix develop -c bash -euo pipefail {0}'
      env:
        CHALLENGES_DIR: challenges/${{ inputs.challenges }}
      run: |
        if [ -f "$CHALLENGES_DIR/dojo.yml" ]; then
          echo "::group::Validating dojo.yml"
          ./tools/dojo/parse-dojo-yml "$CHALLENGES_DIR/dojo.yml"
          echo "::endgroup::"
        fi

    - name: Test challenges
      shell: 'nix develop -c bash -euo pipefail {0}'
      env:
        CHALLENGES_DIR: challenges/${{ inputs.challenges }}
        MODIFIED_SINCE: ${{ inputs.modified_since_ref }}
      run: |
        echo "::group::Challenges to be tested"
        pwnshop list "$CHALLENGES_DIR" --modified-since="$MODIFIED_SINCE"
        echo "::endgroup::"

        echo "::group::Testing challenges"
        pwnshop test \
          --modified-since="$MODIFIED_SINCE" \
          --jobs "$(( $(nproc) * 2 ))" \
          --attempts 5 \
          --timeout 600 \
          --silent-failures \
          --log-failures "$RUNNER_TEMP/test-failures" \
          "$CHALLENGES_DIR"
        echo "::endgroup::"

    # TEMPORARY, for debugging CI-only failures: keep each failing test's output. The logs can show
    # tests_private solve code (tracebacks print source lines) and artifacts on this public repository
    # are downloadable by anyone signed in, so encrypt them with the module's git-crypt key. Decrypt with:
    #   LOG_KEY=$(sha256sum .git/git-crypt/keys/MODULE | cut -d' ' -f1) \
    #     openssl enc -d -aes-256-cbc -pbkdf2 -pass env:LOG_KEY -in test-failures.tar.gz.enc | tar xz
    - name: Encrypt test failure logs
      id: failure-logs
      if: ${{ failure() && inputs.gpg_private_key != '' }}
      shell: bash -euo pipefail {0}
      env:
        CHALLENGES: ${{ inputs.challenges }}
      run: |
        [ -d "$RUNNER_TEMP/test-failures" ] || exit 0
        LOG_KEY="$(sha256sum "$(git rev-parse --git-path "git-crypt/keys/${CHALLENGES%%/*}")" | cut -d' ' -f1)"
        export LOG_KEY
        tar -C "$RUNNER_TEMP" -czf - test-failures \
          | openssl enc -aes-256-cbc -pbkdf2 -pass env:LOG_KEY -out "$RUNNER_TEMP/test-failures.tar.gz.enc"
        echo "name=test-failures-${CHALLENGES//\//-}" >> "$GITHUB_OUTPUT"

    - name: Upload encrypted test failure logs
      if: ${{ failure() && steps.failure-logs.outputs.name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.failure-logs.outputs.name }}
        path: ${{ runner.temp }}/test-failures.tar.gz.enc
        retention-days: 7
