name: Verify same-container AppArmor peer fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-apparmor:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0a4d91514c8077a5b77c25aff3ce2d6dc90c1181
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-challenge-runtime
      - name: Compare unpatched and proposed upstream profiles with a disposable container
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/apparmor-probe"
          mkdir -p "$fixture"
          uname -sr
          cat > "$fixture/Dockerfile" <<'DOCKERFILE'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends gdb strace && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          # Rendered example profiles from the upstream Moby proposal.
          cat > "$fixture/before.profile" <<'BEFORE'
          # profile generated by github.com/moby/profiles/apparmor.
          abi <abi/3.0>,
          
          @{PROC}=/proc/
          
          profile "with-api3" flags=(attach_disconnected,mediate_deleted) {
            network,
            # Disallow obsolete socket families removed from the Linux kernel.
            # AF_DECnet has no AppArmor family name, so it cannot be denied here.
            deny network ax25,
            deny network ipx,
            deny network appletalk,
            deny network netrom,
            deny network rose,
            deny network econet,
            deny network atmsvc,
            deny network irda,
            deny network wanpipe,
            deny network isdn,
            deny network caif,
            # Disallow AF_ALG (Linux kernel crypto API); see https://copy.fail/
            deny network alg,
            # Disallow AF_VSOCK to prevent host/guest communication.
            deny network vsock,
            capability,
            file,
            umount,
            # Host (privileged) processes may send signals to container processes.
            signal (receive) peer=unconfined,
            # runc may send signals to container processes (for "docker stop").
            signal (receive) peer=runc,
            # crun may send signals to container processes (for "docker stop" when used with crun OCI runtime).
            signal (receive) peer=crun,
            # dockerd may send signals to container processes (for "docker kill").
            signal (receive) peer=unconfined,
            # Container processes may send signals amongst themselves.
            signal (send,receive) peer="with-api3",
          
            deny @{PROC}/* w,   # deny write for all files directly in /proc (not in a subdir)
            # deny write to files not in /proc/<number>/** or /proc/sys/**
            deny @{PROC}/{[^1-9/],[^1-9/][^0-9/],[^1-9s/][^0-9y/][^0-9s/],[^1-9/][^0-9/][^0-9/][^0-9/]*}/** w,
            deny @{PROC}/sys/[^k]** w,  # deny /proc/sys except /proc/sys/k* (effectively /proc/sys/kernel)
            deny @{PROC}/sys/kernel/{?,??,[^s][^h][^m]**} w,  # deny everything except shm* in /proc/sys/kernel/
            deny @{PROC}/sysrq-trigger rwklx,
            deny @{PROC}/kcore rwklx,
          
            deny mount,
          
            deny /sys/[^f]*/** wklx,
            deny /sys/f[^s]*/** wklx,
            deny /sys/fs/[^c]*/** wklx,
            deny /sys/fs/c[^g]*/** wklx,
            deny /sys/fs/cg[^r]*/** wklx,
            deny /sys/firmware/** rwklx,
            deny /sys/devices/virtual/powercap/** rwklx,
            deny /sys/kernel/security/** rwklx,
          
            # allow processes within the container to trace each other,
            # provided all other LSM and yama setting allow it.
            ptrace (trace,tracedby,read,readby) peer="with-api3",
          }
          BEFORE
          cat > "$fixture/after.profile" <<'AFTER'
          # profile generated by github.com/moby/profiles/apparmor.
          abi <abi/3.0>,
          
          @{PROC}=/proc/
          
          profile "with-api3" flags=(attach_disconnected,mediate_deleted) {
            network,
            # Disallow obsolete socket families removed from the Linux kernel.
            # AF_DECnet has no AppArmor family name, so it cannot be denied here.
            deny network ax25,
            deny network ipx,
            deny network appletalk,
            deny network netrom,
            deny network rose,
            deny network econet,
            deny network atmsvc,
            deny network irda,
            deny network wanpipe,
            deny network isdn,
            deny network caif,
            # Disallow AF_ALG (Linux kernel crypto API); see https://copy.fail/
            deny network alg,
            # Disallow AF_VSOCK to prevent host/guest communication.
            deny network vsock,
            capability,
            file,
            umount,
            # Host (privileged) processes may send signals to container processes.
            signal (receive) peer=unconfined,
            # runc may send signals to container processes (for "docker stop").
            signal (receive) peer=runc,
            # crun may send signals to container processes (for "docker stop" when used with crun OCI runtime).
            signal (receive) peer=crun,
            # dockerd may send signals to container processes (for "docker kill").
            signal (receive) peer=unconfined,
            # Container processes may send signals amongst themselves.
            signal (send,receive) peer="with-api3",
            # With kernel.apparmor_restrict_unprivileged_unconfined=1, an unprivileged
            # profile change is converted to stacking, producing a stacked label such
            # as "<name>//&unconfined".
            # Allow signals to peers with this stacked label as well.
            signal (send,receive) peer="unconfined//&with-api3",
          
            deny @{PROC}/* w,   # deny write for all files directly in /proc (not in a subdir)
            # deny write to files not in /proc/<number>/** or /proc/sys/**
            deny @{PROC}/{[^1-9/],[^1-9/][^0-9/],[^1-9s/][^0-9y/][^0-9s/],[^1-9/][^0-9/][^0-9/][^0-9/]*}/** w,
            deny @{PROC}/sys/[^k]** w,  # deny /proc/sys except /proc/sys/k* (effectively /proc/sys/kernel)
            deny @{PROC}/sys/kernel/{?,??,[^s][^h][^m]**} w,  # deny everything except shm* in /proc/sys/kernel/
            deny @{PROC}/sysrq-trigger rwklx,
            deny @{PROC}/kcore rwklx,
          
            deny mount,
          
            deny /sys/[^f]*/** wklx,
            deny /sys/f[^s]*/** wklx,
            deny /sys/fs/[^c]*/** wklx,
            deny /sys/fs/c[^g]*/** wklx,
            deny /sys/fs/cg[^r]*/** wklx,
            deny /sys/firmware/** rwklx,
            deny /sys/devices/virtual/powercap/** rwklx,
            deny /sys/kernel/security/** rwklx,
          
            # allow processes within the container to trace each other,
            # provided all other LSM and yama setting allow it.
            ptrace (trace,tracedby,read,readby) peer="with-api3",
            # Same stacked-label peer as the signal rule above.
            ptrace (trace,tracedby,read,readby) peer="unconfined//&with-api3",
          }
          AFTER
          nix develop -c docker build --tag runner-apparmor-probe "$fixture"
          cat > "$fixture/check.sh" <<'CHECK'
          set -euo pipefail
          phase="$1"
          probe() {
            local test_name="$1"
            local container="probe-$phase-$test_name"
            local status=0
            shift
            timeout --kill-after=2 15 docker run --name "$container" --user 1000:1000 \
              --security-opt apparmor=with-api3 --cap-add SYS_PTRACE runner-apparmor-probe "$@" || status=$?
            docker rm -f "$container" >/dev/null 2>&1 || true
            printf 'RESULT %s %s %d\n' "$phase" "$test_name" "$status"
            if [ "$phase" = after ] && [ "$status" -ne 0 ]; then
              return 1
            fi
          }
          probe label cat /proc/self/attr/current
          probe signal bash -c 'sleep 60 & child=$!; kill -TERM "$child" && { wait "$child"; [ "$?" -eq 143 ]; }'
          probe strace strace -e trace=execve /bin/true
          probe gdb gdb --nx --batch -ex 'set debuginfod enabled off' -ex starti -ex continue --args /bin/true
          CHECK
          sudo apparmor_parser -r "$fixture/before.profile"
          nix develop -c bash "$fixture/check.sh" before
          sudo apparmor_parser -r "$fixture/after.profile"
          nix develop -c bash "$fixture/check.sh" after
      - name: Report probe denials
        if: ${{ always() }}
        shell: bash
        run: sudo journalctl -k --no-pager | grep -E 'apparmor="DENIED".*profile="with-api3"' | tail -n 20 || true
