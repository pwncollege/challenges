name: Diagnose hosted runner differences

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-runtime:
    name: Runtime probes on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0a4d91514c8077a5b77c25aff3ce2d6dc90c1181
          persist-credentials: false
      - name: Runner versions and policies
        shell: bash
        run: |
          git rev-parse HEAD
          sha256sum flake.lock
          uname -sr
          grep -E '^(ID|VERSION_ID)=' /etc/os-release
          for key in kernel.apparmor_restrict_unprivileged_userns kernel.yama.ptrace_scope; do
            sysctl "$key" || true
          done
          ls -l /dev/kvm /dev/net/tun || true
          python3 - <<'PY'
          import fcntl
          try:
              with open("/dev/kvm", "rb+") as device:
                  print("host KVM API:", fcntl.ioctl(device.fileno(), 0xAE00))
          except OSError as error:
              print("host KVM:", error)
          PY
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-challenge-runtime
      - name: Test stock workspace and container runtime with a disposable fixture
        shell: bash
        run: |
          probe_root="$RUNNER_TEMP/runner-probes"
          mkdir -p "$probe_root/runc/challenge" "$probe_root/kata/challenge"
          cat > "$probe_root/runc/challenge/Dockerfile" <<'DOCKERFILE'
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends gdb strace chromium && rm -rf /var/lib/apt/lists/*
          COPY runner-probe /usr/local/bin/runner-probe
          RUN chmod 755 /usr/local/bin/runner-probe
          DOCKERFILE

          cat > "$probe_root/runc/challenge/runner-probe" <<'PROBE'
          #!/bin/bash
          set -u
          export LC_ALL=C
          echo "workspace mode=$1"
          uname -sr
          id
          cat /proc/self/attr/current || true
          ls -l /dev/kvm /dev/net/tun || true
          if [ "$1" = kata ]; then
            echo "Kata guest booted and the workspace is ready."
            exit 0
          fi
          probe() {
            local label="$1"
            shift
            printf '\n--- %s ---\n' "$label"
            if "$@"; then
              echo "PROBE $label exit=0"
            else
              echo "PROBE $label exit=$?"
            fi
          }
          probe trace-child strace -e trace=execve /bin/true
          probe debug-child gdb --nx --batch -ex 'set debuginfod enabled off' -ex 'set disable-randomization on' -ex starti -ex continue --args /bin/true
          chrome_home=$(mktemp -d)
          probe chromium timeout 25 chromium --headless --disable-gpu --disable-background-networking --user-data-dir="$chrome_home" --dump-dom 'data:text/html,<p>runner-probe-ok</p>'
          rm -rf -- "$chrome_home"
          PROBE

          cp "$probe_root/runc/challenge/"* "$probe_root/kata/challenge/"
          printf 'privileged: true\n' > "$probe_root/kata/challenge.yml"
          for runtime in runc kata; do
            printf '\n--- %s ---\n' "$runtime"
            fixture="$probe_root/$runtime"
            if timeout 220 script --quiet --return --command "nix develop -c pwnshop run --timeout 90 '$fixture' /usr/local/bin/runner-probe '$runtime'" /dev/null; then
              echo "WORKSPACE $runtime exit=0"
            else
              echo "WORKSPACE $runtime exit=$?"
            fi
          done
      - name: Check for relevant kernel denials
        if: ${{ always() }}
        shell: bash
        run: |
          sudo journalctl -k --no-pager | grep -E 'apparmor="DENIED".*(ptrace|userns|signal|mqueue)|segfault.*(qemu|chromium|gdb)' | tail -n 45 || true
