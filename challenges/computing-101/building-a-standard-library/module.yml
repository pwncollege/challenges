- type: header
  content: "scanf"
- type: markdown
  expandable: False
  name: "scanf"
  content: |
    Your formatter turns values into text by following a format string.
    You can use a format string in the other direction too: to describe the values you want to extract from some text.
    A **scanner** follows that description, converts each value, and stores it for the caller.

    We'll first build `sscanf`, which scans a string already in memory.
    Your `atoi` supplies the number conversion, and your `itoa` already showed you how a function can write its output through a pointer while returning a count.
    Once the string scanner works, you'll combine it with `read` to build `scanf` and use it in your calculator.
    These functions have small interfaces of our own; each level describes the arguments and results it needs.
